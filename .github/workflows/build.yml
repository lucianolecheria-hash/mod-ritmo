name: Build Mod
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        config:
          - os: windows-2022
            target: Win32
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@v2
        with:
          target: ${{ matrix.config.target }}
